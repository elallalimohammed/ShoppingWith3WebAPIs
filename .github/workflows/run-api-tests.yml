name: Postman API Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:

jobs:
  postman-tests:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Newman
        run: npm install -g newman

      - name: Set environment variables dynamically
        id: set_env
        run: |
          if [[ "${GITHUB_REF##*/}" == "main" ]]; then
            echo "ENV_BASE_URL=https://api.production.com" >> $GITHUB_ENV
          else
            echo "ENV_BASE_URL=https://api.staging.com" >> $GITHUB_ENV
          fi

      - name: Run Postman Collection with dynamic env
        run: |
          mkdir -p results
          newman run ./collections/MyCollection.json \
            --env-var baseUrl=$ENV_BASE_URL \
            --reporters cli,junit,html \
            --reporter-junit-export results/junit.xml \
            --reporter-html-export results/report.html

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: postman-results
          path: results/
