name: Postman tests (Newman from Postman API)
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  postman-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install newman
        run: npm install -g newman

      - name: Run collection from Postman (live)
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
          COLLECTION_UID: ${{ secrets.POSTMAN_COLLECTION_UID }}
          ENV_UID: ${{ secrets.POSTMAN_ENV_UID }}
        run: |
          # run the collection (collection and env fetched from Postman API)
          newman run "https://api.getpostman.com/collections/${COLLECTION_UID}?apikey=${POSTMAN_API_KEY}" \
            -e "https://api.getpostman.com/environments/${ENV_UID}?apikey=${POSTMAN_API_KEY}" \
            --reporters cli,junit,html \
            --reporter-junit-export results/junit.xml \
            --reporter-html-export results/report.html
      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: postman-results
          path: results/
