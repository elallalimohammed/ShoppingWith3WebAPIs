name: Postman API Tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  postman-tests:
    runs-on: windows-latest

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js (required for Newman)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 3️⃣ Install Newman globally
      - name: Install Newman
        run: npm install -g newman

      # 4️⃣ Run collection from Postman API
      - name: Run Postman Collection
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
          COLLECTION_UID: ${{ secrets.POSTMAN_COLLECTION_UID }}
        run: |
          # Create results folder
          New-Item -ItemType Directory -Force -Path results

          # Collection URL without environment
          $collectionUrl = "https://api.getpostman.com/collections/$env:COLLECTION_UID"
      
          # Run Newman using header for API key
          newman run $collectionUrl --header "X-Api-Key: $env:POSTMAN_API_KEY" `
            --reporters cli,junit,html `
            --reporter-junit-export results/junit.xml `
            --reporter-html-export results/report.html
      
     # 5️⃣ Upload test artifacts
      - name: Upload Newman results
        uses: actions/upload-artifact@v4
        with:
          name: postman-results
          path: results/
