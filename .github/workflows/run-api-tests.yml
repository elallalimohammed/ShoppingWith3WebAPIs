# .github/workflows/api-ci.yml
name: API Integration Tests

on:
  push:
  pull_request:

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repo
      - uses: actions/checkout@v4

      # 2. Setup .NET
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0.x # match your .NET version

      # 3. Setup Node (for Newman)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 4. Install Newman globally
      - name: Install Newman
        run: npm install -g newman
      - name: Debug directory
        run: |
          pwd
          ls -la
      # 5. Build the entire solution
      - name: Build Solution
        run: dotnet build ShoppingWith3WebAPIs.sln --configuration Release

      - name: Start Web APIs
        run: |
          echo "Starting UsersWebAPI..."
          dotnet run --project UsersWebAPI/UsersWebAPI.csproj &

          echo "Starting OrdersWebAPI..."
          dotnet run --project OrdersWebAPI/OrdersWebAPI.csproj &

          echo "Starting PaymentsWebAPI..."
          dotnet run --project PaymentsWebAPI/PaymentsWebAPI.csproj &

          echo "Waiting for APIs to start..."
          sleep 20  # adjust depending on how long your APIs take to start

     # 7. Run Postman Collection using Newman
      - name: Run Postman Tests
        run: |
          newman run postman/MyCollection.postman_collection.json \
            -e postman/MyEnvironment.postman_environment.json \
            --reporters cli,junit \
            --reporter-junit-export newman-report.xml
       
       #echo "Running collection  mock server..."
      - name: Run Newman Tests Against Postman Mock Server
        run: |
            newman run postman/MockServer_ExampleCollection.postman_collection \
            --env-var MOCK_URL=https://56ad7b7f-3550-4c86-999b-b5ae77b00a7f.mock.pstmn.io
          
          #echo "Running second collection..."
        # 7_2. Run Postman Collection using Newman
      - name: Run Postman Tests
        run: |
          newman run postman/ECommerce_Tests.postman_collection.json\
            -e postman/E_commerce_Env.postman_environment.json\
            --reporters cli,junit \
            --reporter-junit-export newman-report-2.xml


      # 8. Upload test report (optional)
      - name: Upload Newman Test Report
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: newman-report.xml
